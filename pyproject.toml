[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MCDatagenPy"
version = "0.0.0.1"
description = "A fast, zero-dependency Python alternative to Minecraft 1.21.1's built-in datagen."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Footdablit2310" }]
keywords = ["minecraft", "modding", "datagen", "neoforge", "fabric", "forge", "quilt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/Footdablit2310/MCDatagenPy"
Issues = "https://github.com/Footdablit2310/MCDatagenPy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_datagen_py"]
